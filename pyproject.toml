[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-project"
version = "0.1.3"
description = "Participant-oriented Apple HealthKit parsing and native feature cleaning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wearable-project = "wearable_project.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wearable_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
