[build-system]
requires= ["setuptools>=77", "wheel"]
build-backend= "setuptools.build_meta"

[project]
name= "wearable-project"
version= "2.1.0"
description= "Preparation of raw wearable-device (Apple HealthKit): auditable processing, statistics, and time-series construction for Apple HealthKit-style exports"
readme= "README.md"
requires-python= ">=3.10"
license= "MIT"
license-files= ["LICENSE"]
authors= [{name= "Evandro S. Ortigossa"},]
keywords= ["wearables", "healthkit", "time-series", "data-science", "digital-health"]
classifiers= [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies= [
  "numpy>=1.24",
  "pandas>=2.1,<4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
plots= [
  "matplotlib>=3.8",
  "plotly>=5.18",
  "seaborn>=0.13",
]
parquet= ["pyarrow>=14"]
dev= [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
wearable-project= "wearable_project.cli:main"

[project.urls]
Repository= "https://github.com/evortigosa/wearable_project"

[tool.setuptools]
package-dir= {""= "src"}

[tool.setuptools.packages.find]
where= ["src"]

[tool.coverage.run]
branch= true
source= ["wearable_project"]

[tool.coverage.report]
show_missing= true
skip_covered= true

[tool.ruff]
line-length= 120
target-version= "py310"

[tool.ruff.lint]
select= ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore= ["E501"]
