[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-project"
version = "0.2.0a2.post3"
description = "Participant-oriented Apple HealthKit native processing and evidence-backed curation policies"
authors = [
  {name = "Evandro S. Ortigossa", email = "evortigosa@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wearable-project = "wearable_project.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wearable_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
